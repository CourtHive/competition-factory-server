name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# competition-factory-server is the one ecosystem service whose CI cannot install
# from the registry alone: `courthive-ingest` is a PRIVATE, UNPUBLISHED package
# consumed as `link:../courthive-ingest` (package.json dependency AND a
# pnpm-workspace.yaml override), and the Jest globalSetup imports it to fail fast
# on a stale build. So the sibling is checked out and built first, using the same
# app-token pattern sync-i18n.yml already uses to reach courthive-i18n.
#
# The other three overrides (tods-competition-factory, @courthive/provider-config,
# @courthive/i18n) ARE published, so they are stripped and installed from the
# registry — only the courthive-ingest link is preserved.
#
# Scope is lint + check-types + build. `pnpm test` needs a Postgres service and is
# a follow-up — see the note above the Build step for the measured evidence.

jobs:
  verify:
    name: lint · types · test · build
    runs-on: ubuntu-latest

    # Postgres and Redis so the FULL suite runs here, end-to-end specs included. Images match
    # this repo's own docker-compose.yml and Guidon's compose/services.yml — three definitions of
    # the same world that must not drift.
    #
    # No seeding step is needed: MigrationRunnerService applies migrations on module init
    # (src/storage/postgres/migration-runner.service.ts), so the schema builds itself against an
    # empty database on the first spec that boots the app.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: guidon
          POSTGRES_PASSWORD: guidon
          POSTGRES_DB: guidon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guidon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: CourtHive
          repositories: competition-factory-server,courthive-ingest

      - name: Checkout competition-factory-server
        uses: actions/checkout@v7
        with:
          path: competition-factory-server

      # Must land as a SIBLING directory: both the package.json dependency and the
      # pnpm-workspace.yaml override resolve `link:../courthive-ingest` relative to
      # the server checkout.
      - name: Checkout courthive-ingest
        uses: actions/checkout@v7
        with:
          repository: CourtHive/courthive-ingest
          token: ${{ steps.app-token.outputs.token }}
          path: courthive-ingest

      # Both repos are checked out into subdirectories, so the workspace root has
      # no package.json for the action to read `packageManager` from — point it at
      # the server's. (courthive-ingest pins the same pnpm major, so one install
      # serves both.)
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: competition-factory-server/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # courthive-ingest links ../factory, which is not checked out here.
      - name: 'Strip link: overrides (courthive-ingest)'
        working-directory: courthive-ingest
        run: |
          node -e "
          const fs = require('fs');
          if (fs.existsSync('pnpm-workspace.yaml')) {
            const before = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
            const after = before.split('\n').filter(line => !/:\s*link:\S+\s*\$/.test(line)).join('\n');
            if (after !== before) fs.writeFileSync('pnpm-workspace.yaml', after);
          }
          "

      # The server consumes courthive-ingest from its build/ output (main:
      # build/index.js), so it must be built before the server installs.
      #
      # --no-frozen-lockfile rather than deleting the lockfile: stripping the
      # overrides makes the lockfile stale, and CI defaults to frozen. Keeping it
      # means only the stripped deps re-resolve while everything else installs at
      # its locked version. Deleting it re-resolves EVERYTHING, which collides with
      # `minimumReleaseAge: 1440` the moment any transitive dep published in the
      # last 24h — a time bomb that fires on an unrelated PR. It fired on this one:
      # `@storybook/csf-plugin@10.5.8 ... within the minimumReleaseAge cutoff`,
      # published 98 seconds inside the window.
      - name: Build courthive-ingest
        working-directory: courthive-ingest
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      # Strip only the PUBLISHED overrides; keep courthive-ingest pointing at the
      # sibling checkout above.
      - name: 'Strip published link: overrides (server)'
        working-directory: competition-factory-server
        run: |
          node -e "
          const fs = require('fs');
          if (fs.existsSync('pnpm-workspace.yaml')) {
            const before = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
            const after = before
              .split('\n')
              .filter(line => !(/:\s*link:\S+\s*\$/.test(line) && !line.includes('courthive-ingest')))
              .join('\n');
            if (after !== before) fs.writeFileSync('pnpm-workspace.yaml', after);
          }
          "

      - name: Install
        working-directory: competition-factory-server
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        working-directory: competition-factory-server
        run: pnpm lint

      - name: Check types
        working-directory: competition-factory-server
        run: pnpm check-types

      # The FULL suite, end-to-end specs included, against the service containers above.
      #
      # This replaces `pnpm test:unit`, which excluded every *.e2e.spec.ts because no database was
      # available. That exclusion had a cost: CFS#934 changed the semantics of a @Public() route,
      # passed this pipeline green, and left a broken e2e spec on main for a day (fixed in #944).
      # A gate that cannot see the tests that describe your route is not a gate.
      #
      # src/config/config-validation.ts marks APP_PORT / APP_NAME / JWT_SECRET / NODE_ENV as
      # @IsDefined and throws 'missing valid ENV' otherwise. Locally these come from an untracked
      # .env; here they are supplied explicitly. NestJS ConfigModule reads .env directly, so
      # neutralising dotenv is not enough to reproduce a runner locally — supplying the variables
      # is.
      #
      # REDIS_URL selects database index 1 rather than the default 0. Sharing a Redis index was
      # measured to make the suite vary run to run; isolating it made three consecutive
      # fresh-database runs identical.
      - name: Test (full suite, Postgres + Redis)
        working-directory: competition-factory-server
        env:
          APP_NAME: competition-factory-server-ci
          APP_PORT: '8383'
          JWT_SECRET: ci-only-value-not-used-by-any-deployment
          NODE_ENV: test
          # STORAGE_PROVIDER gates `e2eEnabled` in six e2e specs — without it they
          # describe.skip and the gate silently covers less than it appears to.
          STORAGE_PROVIDER: postgres
          # APP_MODE=development enables the built-in dev super-admin (axel@castle.com,
          # users.service.ts:40) that those same specs authenticate as. It has no users row, so
          # no amount of database seeding substitutes for it. NEVER set this in a deployed
          # environment: it is a hardcoded super-admin with a published password.
          APP_MODE: development
          PG_HOST: 127.0.0.1
          PG_PORT: '5432'
          PG_USER: guidon
          PG_PASSWORD: guidon
          PG_DATABASE: guidon_ci
          REDIS_URL: redis://127.0.0.1:6379/1
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
        run: pnpm test

      - name: Build
        working-directory: competition-factory-server
        run: pnpm build
