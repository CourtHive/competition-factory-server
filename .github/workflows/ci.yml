name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# competition-factory-server is the one ecosystem service whose CI cannot install
# from the registry alone: `courthive-ingest` is a PRIVATE, UNPUBLISHED package
# consumed as `link:../courthive-ingest` (package.json dependency AND a
# pnpm-workspace.yaml override), and the Jest globalSetup imports it to fail fast
# on a stale build. So the sibling is checked out and built first, using the same
# app-token pattern sync-i18n.yml already uses to reach courthive-i18n.
#
# The other three overrides (tods-competition-factory, @courthive/provider-config,
# @courthive/i18n) ARE published, so they are stripped and installed from the
# registry — only the courthive-ingest link is preserved.
#
# Scope is lint + check-types + build. `pnpm test` needs a Postgres service and is
# a follow-up — see the note above the Build step for the measured evidence.

jobs:
  verify:
    name: lint · types · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: CourtHive
          repositories: competition-factory-server,courthive-ingest

      - name: Checkout competition-factory-server
        uses: actions/checkout@v7
        with:
          path: competition-factory-server

      # Must land as a SIBLING directory: both the package.json dependency and the
      # pnpm-workspace.yaml override resolve `link:../courthive-ingest` relative to
      # the server checkout.
      - name: Checkout courthive-ingest
        uses: actions/checkout@v7
        with:
          repository: CourtHive/courthive-ingest
          token: ${{ steps.app-token.outputs.token }}
          path: courthive-ingest

      # Both repos are checked out into subdirectories, so the workspace root has
      # no package.json for the action to read `packageManager` from — point it at
      # the server's. (courthive-ingest pins the same pnpm major, so one install
      # serves both.)
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: competition-factory-server/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # courthive-ingest links ../factory, which is not checked out here.
      - name: 'Strip link: overrides (courthive-ingest)'
        working-directory: courthive-ingest
        run: |
          node -e "
          const fs = require('fs');
          if (fs.existsSync('pnpm-workspace.yaml')) {
            const before = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
            const after = before.split('\n').filter(line => !/:\s*link:\S+\s*\$/.test(line)).join('\n');
            if (after !== before) fs.writeFileSync('pnpm-workspace.yaml', after);
          }
          "

      # The server consumes courthive-ingest from its build/ output (main:
      # build/index.js), so it must be built before the server installs.
      #
      # --no-frozen-lockfile rather than deleting the lockfile: stripping the
      # overrides makes the lockfile stale, and CI defaults to frozen. Keeping it
      # means only the stripped deps re-resolve while everything else installs at
      # its locked version. Deleting it re-resolves EVERYTHING, which collides with
      # `minimumReleaseAge: 1440` the moment any transitive dep published in the
      # last 24h — a time bomb that fires on an unrelated PR. It fired on this one:
      # `@storybook/csf-plugin@10.5.8 ... within the minimumReleaseAge cutoff`,
      # published 98 seconds inside the window.
      - name: Build courthive-ingest
        working-directory: courthive-ingest
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      # Strip only the PUBLISHED overrides; keep courthive-ingest pointing at the
      # sibling checkout above.
      - name: 'Strip published link: overrides (server)'
        working-directory: competition-factory-server
        run: |
          node -e "
          const fs = require('fs');
          if (fs.existsSync('pnpm-workspace.yaml')) {
            const before = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
            const after = before
              .split('\n')
              .filter(line => !(/:\s*link:\S+\s*\$/.test(line) && !line.includes('courthive-ingest')))
              .join('\n');
            if (after !== before) fs.writeFileSync('pnpm-workspace.yaml', after);
          }
          "

      - name: Install
        working-directory: competition-factory-server
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        working-directory: competition-factory-server
        run: pnpm lint

      - name: Check types
        working-directory: competition-factory-server
        run: pnpm check-types

      # NOTE: `pnpm test` is deliberately NOT run here yet, and the reason is
      # specific rather than caution.
      #
      # The suite needs a real Postgres. Rehearsed in a clean clone with a valid
      # .env (APP_PORT / APP_NAME / JWT_SECRET / NODE_ENV are all @IsDefined in
      # src/config/config-validation.ts) and no database:
      #
      #   Test Suites: 10 failed, 6 skipped, 113 passed, 123 of 129
      #   Tests:       36 failed, 47 skipped, 1180 passed, 1263
      #   error: role "courthive" does not exist
      #
      # Ten suites — providers.service, factory.controller, and the *.e2e.spec
      # files — open a pg pool. Making this green needs a `services: postgres`
      # container with the right role/database plus the migration-runner bootstrap
      # (src/storage/postgres/migration-runner.service.ts), and a CI .env built
      # from the tracked .env.example. That is worth doing and is the obvious next
      # step; it is left out of this PR because it could not be verified locally
      # (no Docker on the authoring machine) and guessing at it in CI is how the
      # first three runs of this workflow were spent.
      #
      # lint + check-types + build were each verified end-to-end in a clean
      # two-repo clone that reproduces this workflow exactly.

      # `pnpm test:unit` rather than `pnpm test`: 15 of the 130 suites open a real
      # pg pool and cannot run without a database, and a Postgres service container
      # was ruled out for this workflow. Measured by running the full suite with
      # Postgres pointed at a closed port, which separates database dependence from
      # config dependence:
      #
      #   Test Suites: 15 failed, 1 skipped, 114 passed, 129 of 130
      #   Tests:       80 failed, 3 skipped, 1196 passed, 1279
      #
      # The gate excludes every `*.e2e.spec.ts` plus two integration tests misnamed
      # as unit specs (factory.controller, providers.service). That is a rule rather
      # than a hand-maintained list, so new e2e specs are covered automatically — at
      # the cost of two e2e suites that would in fact pass without a database
      # (instanceState.middleware, projection-verify). Deliberate: rot-resistance
      # over two suites.
      #
      # Consequence worth knowing: a NEW spec that needs a database and is not named
      # `*.e2e.spec.ts` will fail this gate. That is the intended forcing function —
      # rename it, or drop the dependency.
      #
      # 113 suites / 1171 tests, verified green with Postgres unreachable, and
      # falsified by breaking an included spec (gate goes red).
      # src/config/config-validation.ts marks APP_PORT / APP_NAME / JWT_SECRET /
      # NODE_ENV as @IsDefined and throws 'missing valid ENV' otherwise. Locally
      # these come from an untracked .env, which is why the suite passes on a dev
      # machine and four suites failed on the first CI run here. NestJS ConfigModule
      # reads .env directly, so neutralising dotenv is NOT enough to reproduce a
      # runner locally — supplying the variables is.
      #
      # NODE_ENV=test matches Environment.Testing and is what jest sets anyway.
      # JWT_SECRET only has to satisfy MinLength(1); no suite in this gate verifies
      # a real signature against it.
      - name: Test (database-free suites)
        working-directory: competition-factory-server
        env:
          APP_NAME: competition-factory-server-ci
          APP_PORT: '8383'
          JWT_SECRET: ci-only-value-not-used-by-any-deployment
          NODE_ENV: test
        run: pnpm test:unit

      - name: Build
        working-directory: competition-factory-server
        run: pnpm build
