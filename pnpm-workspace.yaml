packages: []

# Supply-chain freshness policy DISABLED, matching courthive-ams,
# courthive-ingest, courthive-public, epixodic and courthive-rankings.
#
# This was `minimumReleaseAge: 1440` plus an exempt list naming every CourtHive
# package, added 2026-09-01 (525571e5) so that "cross-repo release cascades
# don't get blocked by their own freshness". The intent was right; the
# mechanism does not survive pnpm 12 (pinned 2026-09-06, 8d16ca51).
#
# pnpm 12 verifies the LOCKFILE against policy in a pass that runs before
# resolution, and that pass does not honour the unversioned exempt entries —
# only exact `name@version` pins, which rot on every release. So the exempt
# list silently stopped exempting anything, and the factory 6.38.0 promote to
# production failed for hours on ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION —
# against a package we publish ourselves and had already built, tested and run
# on dev from that exact lockfile.
#
# A freshness floor defends against a compromised upstream shipping a malicious
# version before anyone notices. It buys nothing for the packages it was
# actually firing on, because those are ours, and pnpm 12 gives no working way
# to scope it to third parties only. Third-party cover is not really lost here
# either: `--config.minimumReleaseAge=0` has been passed on every nest install
# since long before this.
minimumReleaseAge: 0

# verifyDepsBeforeRun: false suppresses pnpm's pre-script deps-status check
# (which otherwise runs `pnpm install` on every husky hook + script
# invocation). Aligns this repo with the rest of the ecosystem (factory,
# TMX, components, pdf-factory, persons) which all have this set.
verifyDepsBeforeRun: false

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  '@swc/core': true
  classic-level: true
  core-js: true
  esbuild: true
  unrs-resolver: true

overrides:
  # Pin TypeScript to the 6.x line across the whole tree. TS7 ships the native
  # (Go) compiler, which does not expose the classic JS API (e.g. ts.SyntaxKind),
  # so classic-API tooling crashes on it — nest CLI (getParsedCommandLineOfConfigFile)
  # and eslint-plugin-sonarjs (ts.SyntaxKind.FunctionType) both did. This forces
  # transitive resolvers (e.g. sonarjs) onto 6.x too; pairs with the renovate rule
  # blocking TypeScript major bumps. Remove when the toolchain supports TS7.
  typescript: 6.0.3
  'serve-static@<2': '>=2.2.0'
  tods-competition-factory: link:../factory
  '@courthive/provider-config': link:../provider-config
  '@courthive/i18n': link:../courthive-i18n
  # Security override — brace-expansion ReDoS (GHSA-3jxr-9vmj-r5cp); dev-only,
  # via @nestjs/cli / @swc/cli / jest tooling. Patched 1.1.16 / 2.1.2; patch each major separately.
  brace-expansion@1: '>=1.1.16'
  brace-expansion@2: '>=2.1.2'
  # Security override — fast-uri host confusion (GHSA-v2hh-gcrm-f6hx, high);
  # dev-only, transitive via ajv (^3.0.1). Patched 3.1.4.
  fast-uri: '^4.0.0'
  # Security override — js-yaml exponential parse-time DoS in flow collections
  # (GHSA-mh29-5h37-fv8m, high); runtime, via @nestjs/swagger (OpenAPI YAML).
  # Scoped to the 5.x line so 3.x/4.x consumers keep their API. Patched 5.2.2.
  js-yaml@5: '>=5.2.2'
  # Security override — postcss source-map path traversal (GHSA-7fh5-64p2-3v2j,
  # high); dev-only, transitive via vite / webpack / storybook. Patched 8.5.18.
  postcss: '>=8.5.18'
