# audit-worker is intentionally NOT listed here. It has its own
# pnpm-workspace.yaml (`packages: []`) declaring it a standalone
# workspace root with its own pnpm-lock.yaml. Listing it here makes
# pnpm v11 consolidate its dependencies into the root lockfile on
# install AND delete `audit-worker/pnpm-lock.yaml` as part of that
# normalization — which breaks `mentat-build-all.sh`'s install path
# (`pnpm install --ignore-workspace` from audit-worker/, which
# requires the standalone lockfile). Keep audit-worker installs
# separate; run `pnpm install` inside `audit-worker/` to refresh.
packages: []

# Keep pnpm v11's supply-chain minimumReleaseAge policy active for
# third-party packages (1440 minutes = 1 day floor), but exempt every
# CourtHive package we publish ourselves so cross-repo release cascades
# don't get blocked by their own freshness. CourtHive packages are also
# `link:../` overridden below — the lockfile entries are advisory, not
# fetched — but the exempt-list makes the install pass even when a fresh
# install reads the lockfile without honoring the link override.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - 'tods-competition-factory'
  - 'courthive-*'
  - '@courthive/*'
  - 'pdf-factory'
  - 'scoring-visualizations'
  - 'tabulator-scorecards'

# verifyDepsBeforeRun: false suppresses pnpm's pre-script deps-status check
# (which otherwise runs `pnpm install` on every husky hook + script
# invocation). Aligns this repo with the rest of the ecosystem (factory,
# TMX, components, pdf-factory, persons) which all have this set.
verifyDepsBeforeRun: false

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  '@swc/core': true
  classic-level: true
  core-js: true
  esbuild: true
  unrs-resolver: true

overrides:
  # Pin TypeScript to the 6.x line across the whole tree. TS7 ships the native
  # (Go) compiler, which does not expose the classic JS API (e.g. ts.SyntaxKind),
  # so classic-API tooling crashes on it — nest CLI (getParsedCommandLineOfConfigFile)
  # and eslint-plugin-sonarjs (ts.SyntaxKind.FunctionType) both did. This forces
  # transitive resolvers (e.g. sonarjs) onto 6.x too; pairs with the renovate rule
  # blocking TypeScript major bumps. Remove when the toolchain supports TS7.
  typescript: 6.0.3
  'serve-static@<2': '>=2.2.0'
  tods-competition-factory: link:../factory
  '@courthive/provider-config': link:../provider-config
  '@courthive/i18n': link:../courthive-i18n
  courthive-ingest: link:../courthive-ingest
  # Security override — brace-expansion ReDoS (GHSA-3jxr-9vmj-r5cp); dev-only,
  # via @nestjs/cli / @swc/cli / jest tooling. Patched 1.1.16 / 2.1.2; patch each major separately.
  brace-expansion@1: '>=1.1.16'
  brace-expansion@2: '>=2.1.2'
